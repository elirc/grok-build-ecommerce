services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerce_dev
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: commerce_workspace
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_hr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_dev -d commerce_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_hr_data:
