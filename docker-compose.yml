version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: grokbuildecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grokbuildecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_ecom:/var/lib/postgresql/data

volumes:
  postgres_data_ecom:
